<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Discrepancies</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #3b82f6;
            --background-color: #f8fafc;
            --text-color: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--background-color); color: var(--text-color); min-height: 100vh; padding-bottom: 40px; }

        /* Top Bar */
        .topbar {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white; padding: 18px 24px;
            display: flex; align-items: center; gap: 12px;
            position: relative; overflow: hidden;
        }
        .topbar::after {
            content: ''; position: absolute;
            width: 120px; height: 120px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 50%; top: -50px; right: -30px;
        }
        .btn-back {
            background: rgba(255,255,255,0.2); border: none; color: white;
            width: 36px; height: 36px; border-radius: 10px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: background 0.15s;
        }
        .btn-back:hover { background: rgba(255,255,255,0.3); }
        .topbar-title { font-size: 1rem; font-weight: 600; flex: 1; position: relative; z-index: 1; }
        .btn-logout-top {
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
            color: white; padding: 6px 16px; border-radius: 8px;
            font-size: 0.75rem; font-weight: 600; font-family: 'Poppins', sans-serif;
            cursor: pointer; transition: background 0.15s; position: relative; z-index: 1;
        }
        .btn-logout-top:hover { background: rgba(255,255,255,0.25); }

        /* Filters */
        .filters-bar {
            background: white; border-bottom: 1px solid var(--border);
            padding: 14px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        }
        .filter-group { display: flex; align-items: center; gap: 8px; }
        .filter-label {
            font-size: 0.72rem; font-weight: 600; color: var(--muted);
            text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap;
        }
        .filter-select {
            padding: 7px 12px; border: 1.5px solid var(--border); border-radius: 8px;
            font-size: 0.82rem; font-family: 'Poppins', sans-serif; color: var(--text-color);
            background: white; outline: none; cursor: pointer; transition: border-color 0.2s; min-width: 130px;
        }
        .filter-select:focus { border-color: var(--secondary-color); }
        .search-input-wrap { position: relative; margin-left: auto; }
        .search-input-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; }
        .filter-search {
            padding: 7px 12px 7px 34px; border: 1.5px solid var(--border); border-radius: 8px;
            font-size: 0.82rem; font-family: 'Poppins', sans-serif; color: var(--text-color);
            background: white; outline: none; width: 260px; transition: border-color 0.2s;
        }
        .filter-search:focus { border-color: var(--secondary-color); }
        .filter-search::placeholder { color: #9ca3af; }

        /* Main */
        .main-content { padding: 20px 24px; }
        .results-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .results-count { font-size: 0.78rem; color: var(--muted); font-weight: 500; }
        .results-count span { color: var(--primary-color); font-weight: 700; }

        /* Table */
        .table-card { background: white; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); overflow: hidden; }
        .table-scroll { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .disc-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; min-width: 780px; }
        .disc-table thead tr { background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); }
        .disc-table th {
            padding: 13px 14px; text-align: left;
            font-size: 0.72rem; font-weight: 600; color: rgba(255,255,255,0.9);
            text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap;
        }
        .disc-table th.center { text-align: center; }
        .disc-table td { padding: 12px 14px; border-bottom: 1px solid #f1f5f9; color: var(--text-color); vertical-align: middle; }
        .disc-table tbody tr:last-child td { border-bottom: none; }
        .disc-table tbody tr:hover { background: #f8fafc; }

        .td-serial {
            font-size: 0.72rem; font-weight: 700; color: var(--secondary-color);
            background: #eff6ff; padding: 2px 8px; border-radius: 6px; display: inline-block;
        }
        .td-roll { font-weight: 700; color: var(--primary-color); letter-spacing: 0.02em; font-size: 0.84rem; }
        .td-name { font-weight: 600; font-size: 0.84rem; }
        .td-dept { font-size: 0.78rem; color: var(--muted); }
        .td-issue { font-size: 0.8rem; color: #374151; max-width: 200px; white-space: pre-wrap; overflow: hidden; text-overflow: ellipsis; display: block; overflow-wrap: break-word; }
        .td-center { text-align: center; }

        .badge-status { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; white-space: nowrap; }
        .badge-status.pending { background: #fef3c7; color: #d97706; }
        .badge-status.resolved { background: #dcfce7; color: #16a34a; }
        .badge-status.rejected { background: #fee2e2; color: #dc2626; }
        .badge-status.clarification_requested { background: #dbeafe; color: #2563eb; }

        .btn-view {
            padding: 6px 14px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white; border: none; border-radius: 8px;
            font-size: 0.72rem; font-weight: 600; font-family: 'Poppins', sans-serif;
            cursor: pointer; white-space: nowrap; transition: opacity 0.2s;
        }
        .btn-view:hover { opacity: 0.88; }

        .state-row td { text-align: center; padding: 50px 20px; color: var(--muted); font-size: 0.85rem; }
        .spinner-inline {
            width: 24px; height: 24px; border: 3px solid #e5e7eb;
            border-top-color: var(--secondary-color); border-radius: 50%;
            animation: spin 0.7s linear infinite; display: inline-block;
            vertical-align: middle; margin-right: 8px;
        }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.45); z-index: 1000;
            align-items: flex-start; justify-content: center;
            padding: 40px 20px; overflow-y: auto;
        }
        .modal-overlay.show { display: flex; animation: fadeIn 0.2s ease; }
        .modal-box {
            background: white; border-radius: 18px; width: 100%; max-width: 680px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15); overflow: hidden; flex-shrink: 0;
        }
        .modal-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white; padding: 16px 20px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .modal-header-title { font-size: 0.92rem; font-weight: 600; }
        .modal-close {
            background: rgba(255,255,255,0.2); border: none; color: white;
            width: 30px; height: 30px; border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: background 0.15s;
        }
        .modal-close:hover { background: rgba(255,255,255,0.35); }
        .modal-body { padding: 20px; }

        .modal-info-strip {
            background: #f0f7ff; border: 1px solid #bfdbfe; border-radius: 10px;
            padding: 12px 16px; display: flex; gap: 20px; margin-bottom: 18px; flex-wrap: wrap;
        }
        .modal-info-item { display: flex; flex-direction: column; gap: 2px; }
        .modal-info-label { font-size: 0.68rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .modal-info-value { font-size: 0.85rem; font-weight: 700; color: var(--primary-color); }

        .issue-box { background: #fef9f0; border: 1px solid #fde68a; border-radius: 10px; padding: 12px 14px; margin-bottom: 18px; }
        .issue-box-label { font-size: 0.68rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 5px; }
        .issue-box-text { font-size: 0.86rem; font-weight: 500; color: #1f2937; line-height: 1.55; white-space: pre-wrap; }
        .issue-box-meta { font-size: 0.7rem; color: #9ca3af; margin-top: 6px; }

        .activity-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 14px; padding-bottom: 10px; border-bottom: 2px solid var(--border);
        }
        .activity-title { font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; }
        .btn-add-log {
            display: flex; align-items: center; gap: 6px; padding: 6px 14px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white; border: none; border-radius: 8px;
            font-size: 0.72rem; font-weight: 600; font-family: 'Poppins', sans-serif;
            cursor: pointer; transition: opacity 0.2s;
        }
        .btn-add-log:hover { opacity: 0.88; }

        .new-log-form {
            background: #f8fafc; border: 1.5px solid var(--border); border-radius: 12px;
            padding: 16px; margin-bottom: 16px; flex-direction: column; gap: 14px;
        }

        .activity-list { display: flex; flex-direction: column; }
        .log-entry { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
        .log-entry:last-child { border-bottom: none; }
        .log-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--secondary-color); flex-shrink: 0; margin-top: 5px; }
        .log-dot.pending { background: #d97706; }
        .log-dot.resolved { background: #16a34a; }
        .log-dot.rejected { background: #dc2626; }
        .log-dot.clarification_requested { background: #2563eb; }
        .log-content { flex: 1; min-width: 0; }
        .log-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
        .log-remark { font-size: 0.82rem; color: #374151; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
        .log-meta { font-size: 0.7rem; color: #9ca3af; margin-top: 4px; }
        .log-edit-btn {
            background: none; border: none; cursor: pointer; color: #9ca3af;
            padding: 2px 4px; border-radius: 4px; display: inline-flex; align-items: center;
            transition: color 0.15s, background 0.15s; margin-left: auto; flex-shrink: 0;
        }
        .log-edit-btn:hover { color: var(--secondary-color); background: #eff6ff; }
        .no-logs { font-size: 0.82rem; color: #9ca3af; text-align: center; padding: 24px 0; }

        .form-field label {
            display: block; font-size: 0.72rem; font-weight: 600; color: var(--muted);
            text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px;
        }
        .form-select, .form-textarea {
            width: 100%; padding: 10px 13px; border: 1.5px solid var(--border); border-radius: 10px;
            font-size: 0.86rem; font-family: 'Poppins', sans-serif; color: var(--text-color);
            background: white; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-select:focus, .form-textarea:focus { border-color: var(--secondary-color); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        .form-textarea { resize: vertical; min-height: 90px; }
        .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
        .btn-cancel-form {
            padding: 10px 20px; background: #f1f5f9; color: #64748b; border: none;
            border-radius: 10px; font-size: 0.84rem; font-weight: 600;
            font-family: 'Poppins', sans-serif; cursor: pointer; transition: background 0.15s;
        }
        .btn-cancel-form:hover { background: #e2e8f0; }
        .btn-submit-log {
            padding: 10px 24px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white; border: none; border-radius: 10px;
            font-size: 0.84rem; font-weight: 600; font-family: 'Poppins', sans-serif;
            cursor: pointer; transition: opacity 0.2s;
        }
        .btn-submit-log:hover { opacity: 0.88; }
        .btn-submit-log:disabled { opacity: 0.6; cursor: not-allowed; }
        .form-error {
            background: #fef2f2; border: 1px solid #fecaca; color: #dc2626;
            font-size: 0.78rem; padding: 8px 12px; border-radius: 8px; display: none;
        }
        .form-error.show { display: block; }

        .edit-log-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-top: 8px; }
        .edit-log-box .form-field { margin-bottom: 10px; }

        .toast {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1e293b; color: white; padding: 12px 22px; border-radius: 12px;
            font-size: 0.84rem; font-weight: 500; font-family: 'Poppins', sans-serif;
            opacity: 0; transition: opacity 0.3s, transform 0.3s;
            z-index: 2000; white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="topbar">
        <button class="btn-back" onclick="goBack()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="topbar-title">Attendance Discrepancies</div>
        <button class="btn-logout-top" onclick="handleLogout()">Logout</button>
    </div>

    <div class="filters-bar">
        <div class="filter-group">
            <span class="filter-label">Date</span>
            <select class="filter-select" id="filterDate" onchange="applyFilters()">
                <option value="">All Dates</option>
                <option value="2026-06-08">08 Jun 2026</option>
                <option value="2026-06-09">09 Jun 2026</option>
                <option value="2026-06-10">10 Jun 2026</option>
                <option value="2026-06-11">11 Jun 2026</option>
                <option value="2026-06-12">12 Jun 2026</option>
            </select>
        </div>
        <div class="filter-group">
            <span class="filter-label">Session</span>
            <select class="filter-select" id="filterSession" onchange="applyFilters()">
                <option value="">All Sessions</option>
                <option value="Session 1">Session 1</option>
                <option value="Session 2">Session 2</option>
                <option value="Session 3">Session 3</option>
            </select>
        </div>
        <div class="filter-group">
            <span class="filter-label">Status</span>
            <select class="filter-select" id="filterStatus" onchange="applyFilters()">
                <option value="">All Statuses</option>
                <option value="pending">Pending</option>
                <option value="clarification_requested">Clarification Requested</option>
                <option value="resolved">Resolved</option>
                <option value="rejected">Rejected</option>
            </select>
        </div>
        <div class="search-input-wrap">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
            </svg>
            <input type="text" class="filter-search" id="filterSearch" placeholder="Search roll no, name, department…" oninput="applyFilters()">
        </div>
    </div>

    <div class="main-content">
        <div class="results-meta">
            <div class="results-count" id="resultsCount"></div>
        </div>
        <div class="table-card">
            <div class="table-scroll">
                <table class="disc-table">
                    <thead>
                        <tr>
                            <th class="center">#</th>
                            <th>Roll No.</th>
                            <th>Name</th>
                            <th>Department</th>
                            <th>Batch</th>
                            <th>Date</th>
                            <th>Session</th>
                            <th>Issue</th>
                            <th class="center">Status</th>
                            <th class="center">View</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr class="state-row">
                            <td colspan="9"><span class="spinner-inline"></span> Loading records…</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="mainModal">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-header-title">Discrepancy Details</div>
                <button class="modal-close" onclick="closeModal()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="modal-info-strip">
                    <div class="modal-info-item">
                        <span class="modal-info-label">Roll No.</span>
                        <span class="modal-info-value" id="mRoll">—</span>
                    </div>
                    <div class="modal-info-item">
                        <span class="modal-info-label">Name</span>
                        <span class="modal-info-value" id="mName">—</span>
                    </div>
                    <div class="modal-info-item">
                        <span class="modal-info-label">Date</span>
                        <span class="modal-info-value" id="mDate">—</span>
                    </div>
                    <div class="modal-info-item">
                        <span class="modal-info-label">Session</span>
                        <span class="modal-info-value" id="mSession">—</span>
                    </div>
                    <div class="modal-info-item">
                        <span class="modal-info-label">Status</span>
                        <span class="modal-info-value" id="mStatus">—</span>
                    </div>
                </div>

                <div class="issue-box">
                    <div class="issue-box-label">Issue Reported</div>
                    <div class="issue-box-text" id="mIssue">—</div>
                    <div class="issue-box-meta" id="mIssueMeta">—</div>
                </div>

                <div class="activity-header">
                    <span class="activity-title">Activity Log</span>
                    <button class="btn-add-log" onclick="toggleNewLogForm()">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                        Add New Log
                    </button>
                </div>

                <div class="new-log-form" id="newLogForm" style="display:none;">
                    <div class="form-field">
                        <label>New Status</label>
                        <select class="form-select" id="newLogStatus">
                            <option value="">— Select Status —</option>
                            <option value="clarification_requested">Clarification Requested</option>
                            <option value="resolved">Resolved</option>
                            <option value="rejected">Rejected</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label>Remarks</label>
                        <textarea class="form-textarea" id="newLogRemarks" placeholder="Add remarks or notes about this update…"></textarea>
                    </div>
                    <div class="form-error" id="newLogError"></div>
                    <div class="form-actions">
                        <button class="btn-cancel-form" onclick="toggleNewLogForm()">Cancel</button>
                        <button class="btn-submit-log" id="newLogSubmitBtn" onclick="submitNewLog()">Save Log</button>
                    </div>
                </div>

                <div class="activity-list" id="activityList">
                    <div class="no-logs">Loading…</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://wetnbnemedzyzudvuihb.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndldG5ibmVtZWR6eXp1ZHZ1aWhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ5MjM2ODksImV4cCI6MjA3MDQ5OTY4OX0.53iKjcKaImIz10H8hJv0MkDl08R8Pu8OprDcURqSmRQ';
        const SESSION_KEY = 'faculty_session';
        const SESSION_DURATION_MS = 2 * 60 * 60 * 1000;

        let allRecords = [];
        let currentIrregularityId = null;

        const apiHeaders = {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
            'Content-Type': 'application/json'
        };

        function getSession() {
            try {
                const raw = localStorage.getItem(SESSION_KEY);
                if (!raw) return null;
                const s = JSON.parse(raw);
                if (Date.now() - s.login_time > SESSION_DURATION_MS) { localStorage.removeItem(SESSION_KEY); return null; }
                return s;
            } catch { return null; }
        }

        function goBack() { window.location.href = '../dashboard.html'; }
        function handleLogout() { localStorage.removeItem(SESSION_KEY); window.location.href = '../../../index.html'; }

        function formatDate(str) {
            if (!str) return '\u2014';
            const d = new Date(str + 'T00:00:00');
            return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        function formatDateTime(str) {
            if (!str) return '\u2014';
            const utc = new Date(str);
            const ist = new Date(utc.getTime() + 5.5 * 60 * 60 * 1000);
            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            let h = ist.getUTCHours();
            const m = String(ist.getUTCMinutes()).padStart(2, '0');
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            return String(ist.getUTCDate()).padStart(2,'0') + ' ' + months[ist.getUTCMonth()] + ' ' + ist.getUTCFullYear() + ', ' + h + ':' + m + ' ' + ampm;
        }

        function formatStatus(s) {
            const map = { pending: 'Pending', resolved: 'Resolved', rejected: 'Rejected', clarification_requested: 'Clarification Requested' };
            return map[s] || s;
        }

        function statusBadge(s) {
            return '<span class="badge-status ' + s + '">' + formatStatus(s) + '</span>';
        }

        async function fetchRecords() {
            try {
                const res = await fetch(SUPABASE_URL + '/rest/v1/view_attendance_irregularities?select=*&order=roll_number.asc,date.asc,session.asc', { headers: apiHeaders });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                allRecords = await res.json();
                applyFilters();
            } catch (err) {
                document.getElementById('tableBody').innerHTML = '<tr class="state-row"><td colspan="9" style="color:#dc2626;">Failed to load records. ' + err.message + '</td></tr>';
            }
        }

        function applyFilters() {
            const date    = document.getElementById('filterDate').value;
            const session = document.getElementById('filterSession').value;
            const status  = document.getElementById('filterStatus').value;
            const q       = document.getElementById('filterSearch').value.trim().toLowerCase();

            const filtered = allRecords.filter(function(r) {
                if (date && r.date !== date) return false;
                if (session && r.session !== session) return false;
                if (status && r.current_status !== status) return false;
                if (q && !(r.roll_number + ' ' + r.name + ' ' + r.department).toLowerCase().includes(q)) return false;
                return true;
            });
            renderTable(filtered);
        }

        function escAttr(str) {
            return (str || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function renderTable(records) {
            document.getElementById('resultsCount').innerHTML = '<span>' + records.length + '</span> record' + (records.length !== 1 ? 's' : '') + ' found';
            if (records.length === 0) {
                document.getElementById('tableBody').innerHTML = '<tr class="state-row"><td colspan="9">No matching records found.</td></tr>';
                return;
            }
            var html = '';
            for (var i = 0; i < records.length; i++) {
                var r = records[i];
                html += '<tr>';
                html += '<td class="td-center"><span class="td-serial">' + (i + 1) + '</span></td>';
                html += '<td><span class="td-roll">' + escAttr(r.roll_number) + '</span></td>';
                html += '<td><span class="td-name">' + escAttr(r.name) + '</span></td>';
                html += '<td><span class="td-dept">' + escAttr(r.department) + '</span></td>';
                html += '<td><span class="td-batch">' + escAttr(r.batch || '—') + '</span></td>';
                html += '<td>' + formatDate(r.date) + '</td>';
                html += '<td>' + escAttr(r.session) + '</td>';
                html += '<td><span class="td-issue" title="' + escAttr(r.issue) + '">' + escAttr(r.issue) + '</span></td>';
                html += '<td class="td-center">' + statusBadge(r.current_status) + '</td>';
                html += '<td class="td-center"><button class="btn-view" data-id="' + r.id + '">View Details</button></td>';
                html += '</tr>';
            }
            document.getElementById('tableBody').innerHTML = html;

            // Attach click handlers — no inline JS, no escaping issues
            document.querySelectorAll('.btn-view').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    openModal(parseInt(btn.dataset.id));
                });
            });
        }

        async function openModal(id) {
            currentIrregularityId = id;
            document.getElementById('mainModal').classList.add('show');
            document.getElementById('mRoll').textContent    = '\u2014';
            document.getElementById('mName').textContent    = '\u2014';
            document.getElementById('mDate').textContent    = '\u2014';
            document.getElementById('mSession').textContent = '\u2014';
            document.getElementById('mStatus').innerHTML    = '\u2014';
            document.getElementById('mIssue').textContent   = '\u2014';
            document.getElementById('mIssueMeta').textContent = '\u2014';
            document.getElementById('activityList').innerHTML = '<div class="no-logs">Loading\u2026</div>';
            document.getElementById('newLogForm').style.display = 'none';
            document.getElementById('newLogStatus').value = '';
            document.getElementById('newLogRemarks').value = '';
            document.getElementById('newLogError').classList.remove('show');

            try {
                var irRes   = await fetch(SUPABASE_URL + '/rest/v1/view_attendance_irregularities?id=eq.' + id, { headers: apiHeaders });
                var logsRes = await fetch(SUPABASE_URL + '/rest/v1/attendance_irregularity_logs?irregularity_id=eq.' + id + '&order=created_at.desc&select=*,faculty_details(name)', { headers: apiHeaders });
                var irData   = await irRes.json();
                var logsData = await logsRes.json();
                var ir = irData[0];
                if (!ir) return;

                document.getElementById('mRoll').textContent    = ir.roll_number || '\u2014';
                document.getElementById('mName').textContent    = ir.name || '\u2014';
                document.getElementById('mDate').textContent    = formatDate(ir.date);
                document.getElementById('mSession').textContent = ir.session || '\u2014';
                document.getElementById('mStatus').innerHTML    = statusBadge(ir.current_status);
                document.getElementById('mIssue').textContent   = ir.issue || '\u2014';
                document.getElementById('mIssueMeta').textContent = 'Reported by ' + (ir.created_by || '\u2014') + ' \u00b7 ' + formatDateTime(ir.created_at);

                renderActivityLog(logsData);
            } catch(e) {
                document.getElementById('activityList').innerHTML = '<div class="no-logs" style="color:#dc2626;">Failed to load details.</div>';
            }
        }

        function renderActivityLog(logs) {
            if (!logs.length) {
                document.getElementById('activityList').innerHTML = '<div class="no-logs">No activity logged yet.</div>';
                return;
            }
            var html = '';
            for (var i = 0; i < logs.length; i++) {
                var log = logs[i];
                var name = (log.faculty_details && log.faculty_details.name) ? log.faculty_details.name : '\u2014';
                html += '<div class="log-entry" id="log-entry-' + log.id + '">';
                html += '<div class="log-dot ' + log.status + '"></div>';
                html += '<div class="log-content">';
                html += '<div class="log-top">' + statusBadge(log.status);
                html += '<button class="log-edit-btn" data-log-id="' + log.id + '" data-status="' + log.status + '" title="Edit this log">';
                html += '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
                html += '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>';
                html += '<path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button></div>';
                html += '<div class="log-remark" id="log-remark-' + log.id + '">' + (log.remarks ? escAttr(log.remarks) : '\u2014') + '</div>';
                html += '<div class="log-meta">' + escAttr(name) + ' \u00b7 ' + formatDateTime(log.created_at) + '</div>';
                html += '<div id="log-edit-area-' + log.id + '"></div>';
                html += '</div></div>';
            }
            document.getElementById('activityList').innerHTML = html;

            // Attach edit button handlers via JS — avoids all inline escaping problems
            document.querySelectorAll('.log-edit-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var logId  = parseInt(btn.dataset.logId);
                    var status = btn.dataset.status;
                    var remarkEl = document.getElementById('log-remark-' + logId);
                    // Read raw text content for edit pre-fill; replace em-dash placeholder with empty
                    var remarks = remarkEl ? remarkEl.textContent.trim() : '';
                    if (remarks === '\u2014') remarks = '';
                    startEditLog(logId, status, remarks);
                });
            });
        }

        function startEditLog(logId, currentStatus, currentRemarks) {
            // Close any other open edit areas
            document.querySelectorAll('[id^="log-edit-area-"]').forEach(function(el) { el.innerHTML = ''; });

            var area = document.getElementById('log-edit-area-' + logId);
            var selOpts = ['clarification_requested','resolved','rejected'].map(function(v) {
                return '<option value="' + v + '"' + (currentStatus === v ? ' selected' : '') + '>' + formatStatus(v) + '</option>';
            }).join('');

            area.innerHTML =
                '<div class="edit-log-box">' +
                '<div class="form-field"><label>Status</label>' +
                '<select class="form-select" id="edit-status-' + logId + '">' + selOpts + '</select></div>' +
                '<div class="form-field"><label>Remarks</label>' +
                '<textarea class="form-textarea" id="edit-remarks-' + logId + '" style="min-height:70px;"></textarea></div>' +
                '<div class="form-error" id="edit-error-' + logId + '"></div>' +
                '<div class="form-actions">' +
                '<button class="btn-cancel-form" id="edit-cancel-' + logId + '">Cancel</button>' +
                '<button class="btn-submit-log" id="edit-save-' + logId + '">Save Changes</button>' +
                '</div></div>';

            // Set textarea value safely via JS (avoids HTML encoding issues with remarks content)
            document.getElementById('edit-remarks-' + logId).value = currentRemarks;

            document.getElementById('edit-cancel-' + logId).addEventListener('click', function() { cancelEditLog(logId); });
            document.getElementById('edit-save-' + logId).addEventListener('click', function() { saveEditLog(logId); });
        }

        function cancelEditLog(logId) {
            document.getElementById('log-edit-area-' + logId).innerHTML = '';
        }

        async function saveEditLog(logId) {
            var status  = document.getElementById('edit-status-' + logId).value;
            var remarks = document.getElementById('edit-remarks-' + logId).value.trim();
            var errEl   = document.getElementById('edit-error-' + logId);
            errEl.classList.remove('show');
            if (!status || !remarks) { errEl.textContent = 'Please fill in all fields.'; errEl.classList.add('show'); return; }

            var session = getSession();
            if (!session) { window.location.href = '../login.html'; return; }

            try {
                var res = await fetch(SUPABASE_URL + '/rest/v1/attendance_irregularity_logs?id=eq.' + logId, {
                    method: 'PATCH',
                    headers: Object.assign({}, apiHeaders, { 'Prefer': 'return=representation' }),
                    body: JSON.stringify({ status: status, remarks: remarks })
                });
                if (!res.ok) throw new Error('Update failed');
                showToast('Log entry updated.');
                cancelEditLog(logId);
                await refreshModal();
            } catch(err) {
                errEl.textContent = err.message;
                errEl.classList.add('show');
            }
        }

        async function submitNewLog() {
            var status  = document.getElementById('newLogStatus').value;
            var remarks = document.getElementById('newLogRemarks').value.trim();
            var errEl   = document.getElementById('newLogError');
            var btn     = document.getElementById('newLogSubmitBtn');
            errEl.classList.remove('show');
            if (!status || !remarks) { errEl.textContent = 'Please select a status and add remarks.'; errEl.classList.add('show'); return; }

            var session = getSession();
            if (!session) { window.location.href = '../login.html'; return; }

            btn.disabled = true;
            btn.textContent = 'Saving\u2026';
            try {
                var res = await fetch(SUPABASE_URL + '/rest/v1/attendance_irregularity_logs', {
                    method: 'POST',
                    headers: Object.assign({}, apiHeaders, { 'Prefer': 'return=representation' }),
                    body: JSON.stringify({ irregularity_id: currentIrregularityId, status: status, remarks: remarks, faculty_id: session.id })
                });
                if (!res.ok) throw new Error('Failed to save log.');
                document.getElementById('newLogStatus').value = '';
                document.getElementById('newLogRemarks').value = '';
                document.getElementById('newLogForm').style.display = 'none';
                showToast('Log added successfully.');
                await refreshModal();
            } catch(err) {
                errEl.textContent = err.message;
                errEl.classList.add('show');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Save Log';
            }
        }

        async function refreshModal() {
            var logsRes = await fetch(SUPABASE_URL + '/rest/v1/attendance_irregularity_logs?irregularity_id=eq.' + currentIrregularityId + '&order=created_at.desc&select=*,faculty_details(name)', { headers: apiHeaders });
            renderActivityLog(await logsRes.json());
            var irRes = await fetch(SUPABASE_URL + '/rest/v1/view_attendance_irregularities?id=eq.' + currentIrregularityId, { headers: apiHeaders });
            var ir = (await irRes.json())[0];
            if (ir) document.getElementById('mStatus').innerHTML = statusBadge(ir.current_status);
            await fetchRecords();
        }

        function toggleNewLogForm() {
            var form = document.getElementById('newLogForm');
            var isHidden = form.style.display === 'none';
            form.style.display = isHidden ? 'flex' : 'none';
            if (!isHidden) {
                document.getElementById('newLogStatus').value = '';
                document.getElementById('newLogRemarks').value = '';
                document.getElementById('newLogError').classList.remove('show');
            }
        }

        function closeModal() {
            document.getElementById('mainModal').classList.remove('show');
            currentIrregularityId = null;
        }

        document.getElementById('mainModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        function showToast(msg) {
            var t = document.createElement('div');
            t.className = 'toast';
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(function() { t.classList.add('show'); }, 10);
            setTimeout(function() { t.classList.remove('show'); setTimeout(function() { t.remove(); }, 300); }, 3000);
        }

        window.addEventListener('DOMContentLoaded', function() {
            if (!getSession()) { window.location.href = '../login.html'; return; }
            fetchRecords();
        });
    </script>
</body>
</html>
