<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Student Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #3b82f6;
            --accent-color: #60a5fa;
            --background-color: #f8fafc;
            --text-color: #1f2937;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* ── Top Bar ── */
        .topbar {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        .topbar::after {
            content: '';
            position: absolute;
            width: 100px;
            height: 100px;
            border: 2px solid rgba(255,255,255,0.12);
            border-radius: 50%;
            top: -40px;
            right: -30px;
        }

        .btn-back {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.15s;
        }

        .btn-back:active {
            background: rgba(255,255,255,0.35);
        }

        .topbar-title {
            font-size: 1rem;
            font-weight: 600;
            flex: 1;
            position: relative;
            z-index: 1;
        }

        /* ── User Info Badge ── */
        .user-badge {
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.07);
            padding: 16px 20px;
            margin: 20px 16px 0;
            display: flex;
            align-items: center;
            gap: 14px;
            animation: fadeInUp 0.3s ease;
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .user-info .user-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .user-info .user-id {
            font-size: 0.75rem;
            color: #9ca3af;
            margin-top: 2px;
        }

        /* ── Placeholder Content ── */
        .content-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.06);
            margin: 16px 16px 0;
            padding: 30px 20px;
            text-align: center;
            animation: fadeInUp 0.4s ease 0.1s both;
        }

        .placeholder-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .placeholder-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .placeholder-title::after {
            content: "";
            display: block;
            width: 40px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            border-radius: 10px;
            margin: 10px auto 0;
        }

        .placeholder-text {
            color: #6b7280;
            font-size: 0.88rem;
            margin-top: 14px;
            line-height: 1.6;
        }

        .coming-soon-badge {
            display: inline-block;
            background: #eff6ff;
            color: var(--secondary-color);
            font-size: 0.72rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            margin-top: 16px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        /* ── Logout Button ── */
        .bottom-actions {
            padding: 20px 16px 0;
            animation: fadeInUp 0.4s ease 0.2s both;
        }

        .btn-logout {
            width: 100%;
            padding: 14px;
            background: white;
            color: #ef4444;
            border: 1.5px solid #fecaca;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-logout:active {
            transform: scale(0.98);
            background: #fef2f2;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="topbar">
        <button class="btn-back" onclick="goBack()">‹</button>
        <div class="topbar-title">Student Details</div>
    </div>

    <!-- User Info Badge -->
    <div class="user-badge">
        <div class="user-avatar">🎓</div>
        <div class="user-info">
            <div class="user-name" id="facultyName">—</div>
            <div class="user-id" id="facultyId">—</div>
        </div>
    </div>

    <!-- Placeholder Content -->
    <div class="content-card">
        <div class="placeholder-icon">👨‍🎓</div>
        <div class="placeholder-title">Student Details</div>
        <p class="placeholder-text">
            This section will display student records and related information.
            Content coming soon.
        </p>
        <span class="coming-soon-badge">🚧 Under Development</span>
    </div>

    <!-- Logout -->
    <div class="bottom-actions">
        <button class="btn-logout" onclick="handleLogout()">🚪 Logout</button>
    </div>

    <script>
        const SESSION_KEY = 'faculty_session';
        const SESSION_DURATION_MS = 2 * 60 * 60 * 1000;

        function getSession() {
            try {
                const raw = localStorage.getItem(SESSION_KEY);
                if (!raw) return null;
                const session = JSON.parse(raw);
                if (Date.now() - session.login_time > SESSION_DURATION_MS) {
                    localStorage.removeItem(SESSION_KEY);
                    return null;
                }
                return session;
            } catch {
                return null;
            }
        }

        function goBack() {
            window.location.href = '../dashboard.html';
        }

        function handleLogout() {
            localStorage.removeItem(SESSION_KEY);
            window.location.href = '../../../index.html';
        }

        window.addEventListener('DOMContentLoaded', () => {
            const session = getSession();
            if (!session) {
                window.location.href = '../login.html';
                return;
            }
            document.getElementById('facultyName').textContent = session.name;
            document.getElementById('facultyId').textContent = 'ID: ' + session.user_id;
        });
    </script>
</body>
</html>
