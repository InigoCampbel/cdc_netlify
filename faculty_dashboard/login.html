<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Faculty Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #3b82f6;
            --accent-color: #60a5fa;
            --background-color: #f8fafc;
            --text-color: #1f2937;
            --error-color: #ef4444;
            --success-color: #22c55e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: white;
            border-radius: 22px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 40px 30px;
            text-align: center;
            width: 100%;
            max-width: 420px;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.4s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .decorative-element {
            position: absolute;
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
        }

        .circle-element {
            width: 125px;
            height: 125px;
            border: 2px solid var(--secondary-color);
            border-radius: 50%;
            top: -60px;
            right: -60px;
        }

        .circle-element-2 {
            width: 80px;
            height: 80px;
            border: 2px solid var(--accent-color);
            border-radius: 50%;
            bottom: -30px;
            left: -30px;
        }

        .content {
            position: relative;
            z-index: 1;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            position: relative;
            display: inline-block;
        }

        h1::after {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            border-radius: 10px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 0.85rem;
            margin-top: 1.2rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 0.4rem;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            color: var(--text-color);
            background: #f8fafc;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        input:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
            background: white;
        }

        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: var(--error-color);
            font-size: 0.82rem;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 1rem;
            display: none;
            text-align: left;
        }

        .error-message.show {
            display: block;
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 0.5rem;
            letter-spacing: 0.02em;
        }

        .btn-login:hover {
            opacity: 0.92;
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .back-link {
            display: block;
            margin-top: 1.5rem;
            color: #6b7280;
            font-size: 0.82rem;
            text-decoration: none;
        }

        .back-link span {
            color: var(--secondary-color);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="decorative-element circle-element"></div>
        <div class="decorative-element circle-element-2"></div>

        <div class="content">
            <h1>Faculty Login</h1>
            <p class="subtitle">Sign in to access your dashboard</p>

            <div class="error-message" id="errorMsg">⚠️ Invalid User ID or Password. Please try again.</div>

            <div class="form-group">
                <label for="userId">User ID</label>
                <input type="text" id="userId" placeholder="Enter your User ID" autocomplete="username" />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
            </div>

            <button class="btn-login" id="loginBtn" onclick="handleLogin()">Sign In</button>

            <a href="../../index.html" class="back-link">← Back to <span>Home</span></a>
        </div>
    </div>

    <script>
        // ── CONFIG ── Replace with your actual Supabase credentials ──
        const SUPABASE_URL = 'https://wetnbnemedzyzudvuihb.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndldG5ibmVtZWR6eXp1ZHZ1aWhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ5MjM2ODksImV4cCI6MjA3MDQ5OTY4OX0.53iKjcKaImIz10H8hJv0MkDl08R8Pu8OprDcURqSmRQ';
        // ─────────────────────────────────────────────────────────────

        const SESSION_KEY = 'faculty_session';
        const SESSION_DURATION_MS = 2 * 60 * 60 * 1000; // 2 hours

        // If already logged in and session valid, skip to dashboard
        window.addEventListener('DOMContentLoaded', () => {
            const session = getSession();
            if (session) {
                window.location.href = 'dashboard.html';
            }
        });

        // Allow Enter key to submit
        document.getElementById('password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleLogin();
        });
        document.getElementById('userId').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        async function handleLogin() {
            const userId = document.getElementById('userId').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const loginBtn = document.getElementById('loginBtn');

            errorMsg.classList.remove('show');

            if (!userId || !password) {
                showError('Please enter both User ID and Password.');
                return;
            }

            // Show loading state
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span> Signing in...';

            try {
                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/faculty_details?user_id=eq.${encodeURIComponent(userId)}&select=id,name,password`,
                    {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json'
                        }
                    }
                );

                if (!response.ok) throw new Error('Network error');

                const data = await response.json();

                if (data.length === 0 || data[0].password !== password) {
                    showError('Invalid User ID or Password. Please try again.');
                    return;
                }

                // Save session to localStorage
                const session = {
                    id: data[0].id,
                    name: data[0].name,
                    login_time: Date.now()
                };
                localStorage.setItem(SESSION_KEY, JSON.stringify(session));

                // Redirect to dashboard
                window.location.href = 'dashboard.html';

            } catch (err) {
                showError('Connection error. Please check your internet and try again.');
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Sign In';
            }
        }

        function showError(msg) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = '⚠️ ' + msg;
            errorMsg.classList.add('show');
        }

        function getSession() {
            try {
                const raw = localStorage.getItem(SESSION_KEY);
                if (!raw) return null;
                const session = JSON.parse(raw);
                if (Date.now() - session.login_time > SESSION_DURATION_MS) {
                    localStorage.removeItem(SESSION_KEY);
                    return null;
                }
                return session;
            } catch {
                return null;
            }
        }
    </script>
</body>
</html>
